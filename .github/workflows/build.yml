name: Build

# Every push and PR: build the STL from build.FCMacro (its asserts are the checks).
# A v* tag also publishes the files as a GitHub release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # gh release create

env:
  FREECAD_VERSION: "1.1.4"  # Same version the model is built with locally.

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache FreeCAD
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/freecad
          key: freecad-${{ env.FREECAD_VERSION }}

      - name: Install FreeCAD AppImage
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/freecad.AppImage \
            "https://github.com/FreeCAD/FreeCAD/releases/download/${FREECAD_VERSION}/FreeCAD_${FREECAD_VERSION}-Linux-x86_64-py311.AppImage"
          chmod +x /tmp/freecad.AppImage
          cd ~ && /tmp/freecad.AppImage --appimage-extract > /dev/null
          mv squashfs-root ~/freecad

      - name: Build model
        env:
          QT_QPA_PLATFORM: offscreen  # Headless Qt, no X server needed.
        run: |
          set -euo pipefail
          # The bundled freecadcmd finds its libs via $ORIGIN; no AppRun needed.
          FREECADCMD=$(find ~/freecad -type f -name freecadcmd | head -1)
          test -x "$FREECADCMD"
          "$FREECADCMD" "$PWD/build.FCMacro" 2>&1 | tee build.log | grep -a PASS
          # FreeCADCmd exits 0 even when the macro raises: require the final PASS line.
          grep -aq "PASS: ring OD" build.log
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: trash-bag-hoop
          path: out/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/*.stl out/*.step out/*.FCStd \
            --title "$GITHUB_REF_NAME" \
            --notes "trash-bag-hoop.stl: ring (176 mm, ribbed) + flex table clamp (69 mm table) on one A1 Mini plate, print as is, no support, no brim. trash-bag-hoop-clamp-test.stl: 6 mm slice of the clamp to test the fit first. Built by CI from build.FCMacro with FreeCAD ${FREECAD_VERSION}."
